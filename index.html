                <div className="flex justify-center my-6 gap-2 px-4 sticky top-0 z-10 bg-white/95 backdrop-blur py-3 border-b border-gray-100">
                    <button 
                    onClick={() => setActiveTab('itinerary')}
                    className={`px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab === 'itinerary' ? 'bg-rose-500 text-white shadow-lg transform scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                    >
                    상세 일정
                    </button>
                    <button 
                    onClick={() => setActiveTab('accommodation')}
                    className={`px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab === 'accommodation' ? 'bg-rose-500 text-white shadow-lg transform scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                    >
                    숙소 추천
                    </button>
                    <button 
                    onClick={() => setActiveTab('budget')}
                    className={`px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeTab === 'budget' ? 'bg-rose-500 text-white shadow-lg transform scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                    >
                    예상 경비
                    </button>
                </div>

                {/* Content */}
                <div className="px-4 pb-12">
                    
                    {/* Itinerary Tab */}
                    {activeTab === 'itinerary' && (
                    <div className="space-y-6">
                        {itinerary.map((day) => (
                        <div key={day.day} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden transition-all hover:shadow-md">
                            <div 
                            className={`p-5 cursor-pointer flex justify-between items-center ${expandedDay === day.day ? 'bg-rose-50/50' : ''}`}
                            onClick={() => setExpandedDay(expandedDay === day.day ? null : day.day)}
                            >
                            <div className="flex items-center gap-5">
                                <div className="flex flex-col items-center justify-center bg-gray-100 rounded-xl w-16 h-16 border border-gray-200">
                                <span className="text-xs font-bold text-gray-500 uppercase">Day</span>
                                <span className="text-2xl font-black text-gray-800">{day.day}</span>
                                </div>
                                <div>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-xs font-bold bg-rose-100 text-rose-600 px-2 py-0.5 rounded-md">{day.date}</span>
                                    <span className="text-xs font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md">{day.city}</span>
                                </div>
                                <h3 className="font-bold text-lg text-gray-800">{day.title}</h3>
                                </div>
                            </div>
                            {expandedDay === day.day ? <ChevronUp className="text-rose-400" /> : <ChevronDown className="text-gray-300" />}
                            </div>

                            {expandedDay === day.day && (
                            <div className="p-5 border-t border-gray-100">
                                <div className="mb-6 p-4 bg-gray-50 rounded-xl text-sm text-gray-600 flex gap-2 items-start">
                                <Info className="text-rose-400 shrink-0 mt-0.5" size={16} />
                                {day.summary}
                                </div>

                                <div className="space-y-6 relative ml-2 before:absolute before:left-[15px] before:top-2 before:bottom-2 before:w-[2px] before:bg-gradient-to-b before:from-rose-200 before:to-orange-100">
                                {day.details.map((detail, idx) => (
                                    <div key={idx} className="relative flex gap-4 items-start pl-8">
                                    <div className="absolute left-[9px] top-[6px] w-3.5 h-3.5 rounded-full bg-white border-2 border-rose-400 z-10"></div>
                                    <div className="min-w-[50px] text-sm font-bold text-gray-400 pt-0.5">{detail.time}</div>
                                    <div className="flex-1">
                                        <div className="flex justify-between items-start mb-1">
                                        <h4 className="font-bold text-gray-800 flex items-center gap-2">
                                            {detail.activity}
                                        </h4>
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); openGoogleMaps(detail.location); }}
                                            className="text-gray-300 hover:text-rose-500 transition-colors"
                                        >
                                            <MapPin size={18} />
                                        </button>
                                        </div>
                                        
                                        {detail.note && (
                                        <p className="text-sm text-gray-600 mb-2">{detail.note}</p>
                                        )}

                                        {detail.moveInfo && (
                                        <div className="inline-flex items-center gap-1.5 text-xs font-medium text-rose-600 bg-rose-50 px-2 py-1 rounded">
                                            {detail.icon} {detail.moveInfo}
                                        </div>
                                        )}
                                    </div>
                                    </div>
                                ))}
                                </div>

                                {/* Spare Spots */}
                                {day.spareSpots.length > 0 && (
                                <div className="mt-8 bg-gradient-to-r from-orange-50 to-rose-50 rounded-xl p-4 border border-rose-100/50">
                                    <h4 className="font-bold text-gray-800 flex items-center gap-2 mb-3 text-sm">
                                    <Star className="text-orange-400" size={16} /> 놓치기 아쉬운 히든 스팟
                                    </h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {day.spareSpots.map((spot, idx) => (
                                        <div key={idx} className="bg-white/80 p-3 rounded-lg border border-rose-100 flex justify-between items-center group hover:bg-white transition-colors">
                                        <div>
                                            <div className="font-bold text-gray-800 text-sm group-hover:text-rose-600 transition-colors">{spot.title}</div>
                                            <div className="text-xs text-gray-500 mt-0.5">{spot.desc}</div>
                                        </div>
                                        </div>
                                    ))}
                                    </div>
                                </div>
                                )}
                                
                                <div className="mt-4 pt-4 border-t border-gray-100 flex justify-end items-center gap-2 text-xs font-medium text-gray-400">
                                <BedDouble size={14} /> {day.stay}
                                </div>
                            </div>
                            )}
                        </div>
                        ))}
                    </div>
                    )}

                    {/* Accommodation Tab */}
                    {activeTab === 'accommodation' && (
                    <div className="space-y-8">
                        {accommodations.map((city, idx) => (
                        <div key={idx} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="bg-gray-50 p-4 border-b border-gray-100 flex justify-between items-center">
                            <h3 className="font-bold text-lg text-gray-800 flex items-center gap-2">
                                <MapPin className="text-rose-500" size={20} /> {city.city}
                            </h3>
                            <span className="text-xs bg-white border border-gray-200 px-2 py-1 rounded text-gray-500">
                                {city.desc}
                            </span>
                            </div>
                            <div className="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {city.spots.map((spot, sIdx) => (
                                <div key={sIdx} className="group border border-gray-200 rounded-xl p-4 hover:border-rose-300 hover:shadow-md transition-all">
                                <div className="flex justify-between items-start mb-3">
                                    <span className={`text-[10px] uppercase tracking-wider font-bold px-2 py-1 rounded ${spot.type.includes('리조트') ? 'bg-cyan-100 text-cyan-700' : 'bg-rose-100 text-rose-700'}`}>
                                    {spot.type}
                                    </span>
                                    <span className="text-sm font-bold text-gray-700">{spot.price}</span>
                                </div>
                                <h4 className="font-bold text-gray-800 mb-2 group-hover:text-rose-600 transition-colors">{spot.name}</h4>
                                <p className="text-xs text-gray-500 leading-relaxed">{spot.reason}</p>
                                </div>
                            ))}
                            </div>
                        </div>
                        ))}
                    </div>
                    )}

                    {/* Budget Tab */}
                    {activeTab === 'budget' && (
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="bg-gray-800 text-white p-6 text-center">
                        <h3 className="text-xl font-bold mb-1">총 예상 경비</h3>
                        <p className="text-3xl font-black text-yellow-400">₩6,300,000</p>
                        <p className="text-xs text-gray-400 mt-2">1인 기준 / 항공권 포함 / 쇼핑 제외</p>
                        </div>
                        <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                        {budget.filter(b => b.category !== '총계').map((item, idx) => (
                            <div key={idx} className="flex items-center p-4 bg-gray-50 rounded-xl border border-gray-100">
                            <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center border border-gray-200 text-gray-400 mr-4 shrink-0">
                                <DollarSign size={18} />
                            </div>
                            <div className="flex-1">
                                <div className="flex justify-between items-center mb-1">
                                <span className="font-bold text-gray-700">{item.category}</span>
                                <span className="font-bold text-gray-900">{item.amount.toLocaleString()}원</span>
                                </div>
                                <p className="text-xs text-gray-400">{item.desc}</p>
                            </div>
                            </div>
                        ))}
                        </div>
                    </div>
                    )}

                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TravelCanvas />);
    </script>
</body>
</html>
